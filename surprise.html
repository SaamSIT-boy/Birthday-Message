
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The final birthday surprise">
    <title>Your Surprise 🎁</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page3">

    <!-- Fireworks Background -->
    <canvas id="fireworks"></canvas>

    <main class="surprise-container">

        <p class="final-small">
            ONE LAST SURPRISE
        </p>

        <!-- Birthday Header -->
        <h1 class="final-title">
            <span class="birthday-emoji">🎉</span>
            <span class="birthday-text">HAPPY BIRTHDAY!</span>
            <span class="birthday-emoji">🎉</span>
        </h1>

        <!-- Gift -->
        <div
            class="gift"
            onclick="openGift()"
            role="button"
            tabindex="0"
            aria-label="Open birthday gift"
        >

            <div class="gift-lid">
                <div class="ribbon"></div>
            </div>

            <div class="gift-box">
                <div class="ribbon"></div>
            </div>

        </div>

        <p id="gift-message">
            Tap the gift 🎁
        </p>

        <!-- Final Message -->
        <div id="final-message">

            <h2>✨ SURPRISE! ✨</h2>

            <p>
                Another year, another chapter,
                and many more beautiful memories waiting for you.
            </p>

            <h3>
                May your birthday be as amazing as you are! ❤️
            </h3>

            <div class="hearts">
                ❤️ 💕 ❤️ 💕 ❤️
            </div>

        </div>

        <!-- Back Button -->
        <button
            onclick="goToPage('index.html')"
            class="birthday-btn"
        >
            Celebrate Again 🎂
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
